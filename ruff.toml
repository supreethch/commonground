line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "UP", "B"]

[lint.per-file-ignores]
# FastAPI declares query and dependency parameters as call expressions in
# argument defaults. That is the framework's documented idiom, not the
# mutable-default bug B008 exists to catch.
"apps/api/**/*.py" = ["B008"]
