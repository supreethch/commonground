# Lint and tests on every push and pull request.
#
# The database-backed tests are not optional here. They skip locally when no
# Postgres is reachable, so CI is the only place guaranteed to run them -- a
# service container is what stops that skip from silently becoming permanent.
#
# The e2e job runs the whole stack -- Postgres, the API, the built frontend --
# and drives it in a real browser on desktop and a mobile viewport. Every
# interesting bug in this project has been at a boundary the unit tests mock, so
# this is the job most likely to catch the next one.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.6
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches the compose stack and what Neon serves.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: commonground
          POSTGRES_PASSWORD: commonground
          POSTGRES_DB: commonground
        ports:
          - 5432:5432
        # Without a health check the job races the database and fails
        # intermittently, which trains everyone to re-run CI instead of reading it.
        options: >-
          --health-cmd "pg_isready -U commonground -d commonground"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://commonground:commonground@localhost:5432/commonground

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -e "packages/engine[dev]"
          pip install -e "apps/api[dev]"
          pip install "psycopg[binary]>=3.2" pytest-asyncio

      - name: Tests
        # Network-marked tests are excluded by the default addopts. CI must not
        # depend on MetaBrainz being up: an upstream outage should not turn every
        # pull request red.
        run: pytest -q

  sources:
    # Checks the upstream dumps are still where docs/data-sources.md says they
    # are, and that their licences have not changed under us. Scheduled rather
    # than blocking, because an upstream being down is not a reason to stop
    # merging code.
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/verify_sources.py --check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # tsc runs as part of build, so a type error fails here rather than in a
      # deploy. Tests are separate so a failure says which of the two broke.
      - run: npm run build
      - run: npm test

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: commonground
          POSTGRES_PASSWORD: commonground
          POSTGRES_DB: commonground
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commonground -d commonground"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://commonground:commonground@localhost:5432/commonground
      DEMO_USER_PASSWORD: demo-read-only
      USER_AGENT: "CommonGround CI (https://github.com/supreethchittaluri/commonground)"
      # The suite signs in and generates playlists dozens of times from one
      # address; a per-IP limiter would throttle the run itself. The limiter has
      # its own dedicated tests in the `test` job.
      RATE_LIMIT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: |
          pip install -e "packages/engine[dev]" -e "apps/api[dev]" "psycopg[binary]>=3.2"
          npm ci --prefix apps/web

      - name: Database and demo data
        # The catalogue is built from a committed fixture rather than fetched:
        # CI must not depend on MetaBrainz being up, and a 2GB dump has no place
        # in a pull request.
        run: |
          python db/migrate.py
          python scripts/seed_ci_catalogue.py
          python scripts/seed.py

      - name: Start the API
        run: |
          uvicorn commonground_api.main:app --port 8010 --log-level warning &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8010/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8010/health

      - name: Playwright
        working-directory: apps/web
        env:
          VITE_PROXY_TARGET: http://localhost:8010
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
